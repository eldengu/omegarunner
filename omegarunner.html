<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>omegarunner</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0e1116;
    color: #e6edf3;
    font-family: "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 16px;
  }
  h1 {
    margin: 4px 0 0;
    font-size: 20px;
    letter-spacing: 2px;
    font-weight: 600;
    color: #58a6ff;
  }
  #game {
    background: linear-gradient(#1a2030, #0c0f16);
    border: 1px solid #283042;
    border-radius: 10px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    display: block;
  }
  .row {
    display: flex;
    gap: 24px;
    align-items: flex-start;
    width: 820px;
    max-width: 100%;
  }
  .col { flex: 1; }
  .panel {
    background: #11161f;
    border: 1px solid #283042;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12px;
    line-height: 1.5;
  }
  .panel h2 {
    margin: 0 0 6px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #8b949e;
  }
  #state {
    white-space: pre-wrap;
    font-family: "Cascadia Code", "Consolas", monospace;
    font-size: 12px;
    color: #ade6c0;
    margin: 0;
  }
  .hint { color: #8b949e; font-size: 12px; }
  kbd {
    background: #21262d;
    border: 1px solid #30363d;
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 6px;
    font-family: monospace;
    font-size: 11px;
  }
  #hud { font-variant-numeric: tabular-nums; }
  #hud b { color: #ffd166; }
</style>
</head>
<body>
<div id="wrap">
  <h1>OMEGARUNNER</h1>
  <canvas id="game" width="600" height="640"></canvas>
  <div class="row">
    <div class="col">
      <div class="panel" id="hud">
        Score: <b id="score">0</b> &nbsp;|&nbsp; Coins: <b id="coins">0</b>
        &nbsp;|&nbsp; Distance: <b id="dist">0</b>m &nbsp;|&nbsp; Speed: <b id="speed">1.0</b>x
        <div class="hint" style="margin-top:6px">
          <kbd>&larr;</kbd> <kbd>&rarr;</kbd> move lanes &nbsp;
          <kbd>&uarr;</kbd> / <kbd>Space</kbd> jump &nbsp;
          <kbd>R</kbd> restart &nbsp;
          <kbd>P</kbd> pause
        </div>
      </div>
    </div>
    <div class="col">
      <div class="panel">
        <h2>LLM State (per tick)</h2>
        <pre id="state">—</pre>
      </div>
    </div>
  </div>
</div>
<script>
"use strict";
/* =========================================================================
   omegarunner — endless runner game engine
   Single-file canvas game. No LLM yet; agentStep() is the seam where an
   LLM (or any policy) will later choose an action each tick.
   ========================================================================= */

// ---- Configuration -------------------------------------------------------
const CONFIG = {
  lanes: 3,
  canvasW: 600,
  canvasH: 640,
  horizonY: 120,        // where the track converges (top)
  laneSwitchTicks: 6,   // ticks to slide between lanes (visual smoothing)
  jumpTicks: 26,        // total airtime of a jump, in ticks
  jumpHeight: 1.0,      // peak lift as fraction (used by arc)
  tickMs: 1000 / 60,    // logic runs per animation frame (~60 fps)
  baseSpeed: 0.18,      // world units (track-fraction) per tick at 1x
  speedRampPer1000: 0.30, // speed multiplier gained per 1000 distance units
  speedMax: 2.1,        // cap so late game stays humanly reactable
  spawnGapMin: 22,      // min ticks between spawn attempts
  spawnGapMax: 40,      // max ticks between spawn attempts
  hardRowExtraGap: 12,  // extra spacing after a hard (blocking) row
  coinValue: 10,
  // An entity's "z" is its position along the track: 1.0 = far horizon,
  // 0.0 = at the player's feet. It decreases each tick as it approaches.
  zStart: 1.0,
  zPlayer: 0.08,        // z at which an entity is level with the player
  zDespawn: -0.05,
};

// Obstacle kinds:
//  'ground'  -> can be avoided by switching lane OR jumping over it.
//  'barrier' -> tall; can ONLY be avoided by switching lane (no jumping).
const KINDS = { GROUND: 'ground', BARRIER: 'barrier', COIN: 'coin' };

// ---- Game state ----------------------------------------------------------
let game;

function newGame() {
  return {
    tick: 0,
    running: true,
    paused: false,
    over: false,
    score: 0,
    coins: 0,
    distance: 0,
    speedMult: 1.0,
    // player
    lane: 1,                 // logical lane index (0..lanes-1)
    laneFrom: 1,             // for visual interpolation
    laneAnim: 0,             // ticks remaining in lane slide
    jumpT: 0,                // ticks remaining in current jump (0 = grounded)
    // world
    entities: [],            // {id, kind, lane, z}
    nextId: 1,
    spawnCountdown: 30,
    lastRowHard: false,      // pacing: was the previous spawned row a blocking one?
    lastState: '',
  };
}

// ---- Spawning ------------------------------------------------------------
// Deterministic-ish RNG seam left simple (Math.random) for now.
function rint(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }

function trySpawn(g) {
  g.spawnCountdown--;
  if (g.spawnCountdown > 0) return;
  g.spawnCountdown = rint(CONFIG.spawnGapMin, CONFIG.spawnGapMax);

  // Difficulty pacing: a "hard" row blocks two or three lanes and demands a
  // precise response (dodge or jump). Never place two hard rows back-to-back —
  // always give an easy/coin breather between them, and space them further
  // apart in time, so any sequence stays survivable for a human.
  const allowHard = !g.lastRowHard;
  const roll = Math.random();
  let hard = false;

  if (roll < 0.42) {
    // Easy: single obstacle in one lane (+ maybe a coin elsewhere).
    const lane = rint(0, CONFIG.lanes - 1);
    const kind = Math.random() < 0.5 ? KINDS.GROUND : KINDS.BARRIER;
    g.entities.push(makeEntity(g, kind, lane));
    if (Math.random() < 0.5) {
      g.entities.push(makeEntity(g, KINDS.COIN, pickOtherLane(lane)));
    }
  } else if (roll < 0.68 && allowHard) {
    // Hard: two lanes blocked, one clear lane (force a lane choice).
    hard = true;
    const clear = rint(0, CONFIG.lanes - 1);
    for (let l = 0; l < CONFIG.lanes; l++) {
      if (l === clear) continue;
      const kind = Math.random() < 0.5 ? KINDS.GROUND : KINDS.BARRIER;
      g.entities.push(makeEntity(g, kind, l));
    }
    if (Math.random() < 0.6) g.entities.push(makeEntity(g, KINDS.COIN, clear));
  } else if (roll < 0.80 && allowHard) {
    // Hard: a full row of GROUND obstacles -> must jump (all lanes covered).
    hard = true;
    for (let l = 0; l < CONFIG.lanes; l++) {
      g.entities.push(makeEntity(g, KINDS.GROUND, l));
    }
  } else {
    // Coins only — a little line of them in one lane (a breather).
    g.entities.push(makeEntity(g, KINDS.COIN, rint(0, CONFIG.lanes - 1)));
  }

  if (hard) g.spawnCountdown += CONFIG.hardRowExtraGap;
  g.lastRowHard = hard;
}

function makeEntity(g, kind, lane) {
  return { id: g.nextId++, kind, lane, z: CONFIG.zStart };
}

function pickOtherLane(lane) {
  let l;
  do { l = rint(0, CONFIG.lanes - 1); } while (l === lane);
  return l;
}

// ---- Player actions ------------------------------------------------------
// The single point an agent/LLM (or keyboard) drives the player.
//   action ∈ {'left','right','jump','stay'}
function applyAction(g, action) {
  if (action === 'left' && g.lane > 0 && g.laneAnim === 0) {
    g.laneFrom = g.lane; g.lane -= 1; g.laneAnim = CONFIG.laneSwitchTicks;
  } else if (action === 'right' && g.lane < CONFIG.lanes - 1 && g.laneAnim === 0) {
    g.laneFrom = g.lane; g.lane += 1; g.laneAnim = CONFIG.laneSwitchTicks;
  } else if (action === 'jump' && g.jumpT === 0) {
    g.jumpT = CONFIG.jumpTicks;
  }
  // 'stay' does nothing.
}

// Player vertical lift (0 = ground, up to 1 at apex) from a jump.
function jumpLift(g) {
  if (g.jumpT === 0) return 0;
  const p = 1 - (g.jumpT / CONFIG.jumpTicks); // 0..1 through the jump
  return Math.sin(Math.PI * p) * CONFIG.jumpHeight;
}

function isAirborne(g) {
  // Considered off the ground for the middle portion of the arc, high enough
  // that ground obstacles pass underneath.
  return jumpLift(g) > 0.45;
}

// ---- Simulation step -----------------------------------------------------
function step(g, action) {
  if (!g.running || g.paused || g.over) return;

  applyAction(g, action);

  // Advance timers.
  if (g.laneAnim > 0) g.laneAnim--;
  if (g.jumpT > 0) g.jumpT--;

  // Speed scales with distance, capped so it stays humanly reactable.
  g.speedMult = Math.min(CONFIG.speedMax,
    1 + (g.distance / 1000) * CONFIG.speedRampPer1000);
  const dz = CONFIG.baseSpeed * 0.06 * g.speedMult;
  g.distance += g.speedMult * 1.0;

  // Advance entities toward the player.
  for (const e of g.entities) e.z -= dz;

  // Collisions / pickups happen as entities cross the player plane.
  for (const e of g.entities) {
    if (e.collected || e.resolved) continue;
    // Entity is "at" the player when its z is within a small band of zPlayer.
    if (e.z <= CONFIG.zPlayer + 0.02 && e.z >= CONFIG.zPlayer - 0.06) {
      if (e.lane !== g.lane) continue; // different lane: no interaction
      if (e.kind === KINDS.COIN) {
        // Coins can be grabbed on the ground or mid-jump.
        e.collected = true;
        g.coins += 1;
        g.score += CONFIG.coinValue;
      } else if (e.kind === KINDS.GROUND) {
        if (isAirborne(g)) {
          e.resolved = true; // jumped over it
        } else {
          endGame(g, e);
          return;
        }
      } else if (e.kind === KINDS.BARRIER) {
        // Tall barrier: jumping does not help.
        endGame(g, e);
        return;
      }
    }
  }

  // Cull entities that have passed.
  g.entities = g.entities.filter(e => e.z > CONFIG.zDespawn && !e.collected);

  trySpawn(g);

  // Survival scoring.
  g.score += 1;
  g.tick++;

  g.lastState = encodeState(g);
}

function endGame(g, byEntity) {
  g.over = true;
  g.running = false;
  g.deathBy = byEntity ? byEntity.kind : 'obstacle';
  g.lastState = encodeState(g);
}

// ---- Text state encoder (LLM-facing) ------------------------------------
// Produces a compact textual description of the current tick: for each lane,
// the nearest notable entity ahead and how far; plus the player's lane and
// whether they are jumping or on the ground.
function encodeState(g) {
  const lines = [];
  for (let l = 0; l < CONFIG.lanes; l++) {
    // Find nearest entity ahead in this lane (smallest z that is still ahead).
    let nearest = null;
    for (const e of g.entities) {
      if (e.lane !== l || e.collected || e.resolved) continue;
      if (e.z < CONFIG.zPlayer - 0.02) continue; // already passed
      if (!nearest || e.z < nearest.z) nearest = e;
    }
    let desc;
    if (!nearest) {
      desc = 'clear';
    } else {
      // Convert z-distance to an integer "tiles ahead" for readability.
      const ahead = Math.max(0, Math.round((nearest.z - CONFIG.zPlayer) / 0.12));
      const label = nearest.kind === KINDS.GROUND ? 'ground-obstacle'
                  : nearest.kind === KINDS.BARRIER ? 'barrier-obstacle'
                  : 'coin';
      desc = `${label} ${ahead} ahead`;
    }
    lines.push(`lane${l + 1}: ${desc}`);
  }
  const posture = g.jumpT > 0 ? (isAirborne(g) ? 'jumping(airborne)' : 'jumping(rising/landing)') : 'on-ground';
  lines.push(`player in lane${g.lane + 1}, ${posture}`);
  lines.push(`score=${g.score} coins=${g.coins} speed=${g.speedMult.toFixed(2)}x`);
  return lines.join('; ');
}

// ---- Agent seam (LLM goes here later) -----------------------------------
// For now returns the keyboard-buffered action. Later: query an LLM with
// encodeState(g) and map its reply to one of {left,right,jump,stay}.
function agentStep(g) {
  const a = pendingAction;
  pendingAction = 'stay';
  return a;
}

// ---- Rendering -----------------------------------------------------------
// NOTE: This entire section is presentation-only. It reads game state but
// never mutates it. All "juice" (particles, shake, pops) is derived by
// DIFFING game state between frames in detectEvents(), so the simulation,
// spawn logic, scoring, encodeState() and agentStep() are untouched.
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// Map a lane index + z-depth to screen coordinates with simple perspective.
function laneCenterX(laneFloat, z) {
  // z: 1 far .. 0 near. Track widens as it comes closer.
  const near = 1 - z; // 0 far .. 1 near
  const halfTop = 70;
  const halfBot = 270;
  const half = halfTop + (halfBot - halfTop) * near;
  const cx = CONFIG.canvasW / 2;
  const laneFrac = (laneFloat - (CONFIG.lanes - 1) / 2) / ((CONFIG.lanes) / 2);
  return cx + laneFrac * half;
}
function depthY(z) {
  const near = 1 - z;
  return CONFIG.horizonY + (CONFIG.canvasH - CONFIG.horizonY) * Math.pow(near, 1.5);
}
function depthScale(z) {
  const near = 1 - z;
  return 0.25 + near * 1.05;
}

// Smooth eased lane interpolation (presentation-only easing of laneAnim).
function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
function playerLaneFloat(g) {
  if (g.laneAnim === 0) return g.lane;
  const t = easeInOut(1 - g.laneAnim / CONFIG.laneSwitchTicks);
  return g.laneFrom + (g.lane - g.laneFrom) * t;
}

// ---- Visual FX state (render-only; does NOT affect game logic) -----------
const fx = {
  gameRef: null,
  runPhase: 0,        // animation clock for the run cycle
  bgScroll: 0,        // scrolls scenery for sense of speed
  particles: [],      // {x,y,vx,vy,life,max,size,color,layer,grav,spin,rot,shape,fade}
  screenPos: new Map(),// id -> {x,y,kind} from last drawn frame (for coin-pop)
  prevCoins: 0,
  prevJumpT: 0,
  prevOver: false,
  shake: 0,           // screen-shake magnitude (px), decays
  land: 0,            // landing squash timer 0..1
  flash: 0,           // white flash on big events
  overT: 0,           // game-over animation clock
  dust: 0,            // running dust emit accumulator
  pops: [],           // {x,y,t,max,text,color} floating score pops
};
function resetFx() {
  fx.runPhase = 0; fx.bgScroll = 0; fx.particles.length = 0; fx.screenPos.clear();
  fx.prevCoins = 0; fx.prevJumpT = 0; fx.prevOver = false; fx.shake = 0;
  fx.land = 0; fx.flash = 0; fx.overT = 0; fx.dust = 0; fx.pops.length = 0;
}

function addParticle(p) {
  p.rot = p.rot || 0; p.spin = p.spin || 0; p.grav = p.grav || 0;
  p.layer = p.layer || 'front'; p.shape = p.shape || 'circle'; p.max = p.life;
  if (fx.particles.length < 600) fx.particles.push(p);
}
function burst(x, y, n, colors, opts = {}) {
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + Math.random() * 0.7;
    const spd = (opts.spd || 3) * (0.4 + Math.random());
    addParticle({
      x, y,
      vx: Math.cos(a) * spd + (opts.vx || 0),
      vy: Math.sin(a) * spd - (opts.up || 0),
      life: (opts.life || 28) * (0.6 + Math.random() * 0.7),
      size: (opts.size || 5) * (0.6 + Math.random() * 0.8),
      color: colors[(Math.random() * colors.length) | 0],
      grav: opts.grav != null ? opts.grav : 0.12,
      spin: (Math.random() - 0.5) * 0.6,
      shape: opts.shape || 'circle',
      layer: opts.layer || 'front',
      fade: opts.fade !== false,
    });
  }
}

// Update all visual-only timers/particles. dtf = frames elapsed (~1 at 60fps).
function updateFx(g, dtf) {
  const spd = (g.speedMult || 1);
  if (!g.over && !g.paused) {
    fx.runPhase += dtf * (0.32 + spd * 0.12);
    fx.bgScroll += dtf * spd * 0.9;
  }
  fx.shake *= Math.pow(0.86, dtf);
  if (fx.shake < 0.15) fx.shake = 0;
  fx.land = Math.max(0, fx.land - dtf * 0.08);
  fx.flash = Math.max(0, fx.flash - dtf * 0.08);
  if (g.over) fx.overT += dtf;

  // Running dust trail while grounded.
  if (!g.over && !g.paused && g.jumpT === 0) {
    fx.dust += dtf * spd;
    if (fx.dust > 3) {
      fx.dust = 0;
      const lf = playerLaneFloat(g);
      const px = laneCenterX(lf, CONFIG.zPlayer);
      const py = depthY(CONFIG.zPlayer);
      addParticle({
        x: px + (Math.random() - 0.5) * 26, y: py - 2,
        vx: -1.4 - Math.random() * 1.6, vy: -0.6 - Math.random(),
        life: 22, size: 4 + Math.random() * 4,
        color: 'rgba(180,200,230,0.5)', grav: 0.02, layer: 'back', shape: 'circle',
      });
    }
  }

  for (const p of fx.particles) {
    p.x += p.vx * dtf; p.y += p.vy * dtf;
    p.vy += p.grav * dtf; p.vx *= Math.pow(0.98, dtf);
    p.rot += p.spin * dtf; p.life -= dtf;
  }
  fx.particles = fx.particles.filter(p => p.life > 0);
  for (const p of fx.pops) p.t += dtf;
  fx.pops = fx.pops.filter(p => p.t < p.max);
}

// Derive juice from state changes — the only place events are detected.
function detectEvents(g) {
  // Coin collected: coins counter rose and a coin id we drew last frame is gone.
  if (g.coins > fx.prevCoins) {
    const live = new Set(g.entities.map(e => e.id));
    let placed = 0;
    for (const [id, sp] of fx.screenPos) {
      if (sp.kind === KINDS.COIN && !live.has(id)) {
        burst(sp.x, sp.y, 16, ['#fff3b0', '#ffd166', '#ffb703', '#fff'],
          { spd: 4, life: 30, size: 5, up: 1.5, grav: 0.18, shape: 'spark' });
        // ring sparkle
        burst(sp.x, sp.y, 8, ['#fffbe6'], { spd: 6, life: 16, size: 3, grav: 0 });
        fx.pops.push({ x: sp.x, y: sp.y - 10, t: 0, max: 34, text: '+' + CONFIG.coinValue, color: '#ffe08a' });
        fx.flash = Math.min(0.5, fx.flash + 0.18);
        placed++;
      }
    }
    if (!placed) { // fallback: pop at player
      const px = laneCenterX(playerLaneFloat(g), CONFIG.zPlayer);
      burst(px, depthY(CONFIG.zPlayer) - 60, 14, ['#ffd166', '#fff'], { spd: 4, life: 26 });
    }
  }
  fx.prevCoins = g.coins;

  // Landing: jump timer reached 0 this frame -> squash + dust + shake.
  if (fx.prevJumpT > 0 && g.jumpT === 0 && !g.over) {
    fx.land = 1; fx.shake = Math.max(fx.shake, 7);
    const px = laneCenterX(playerLaneFloat(g), CONFIG.zPlayer);
    const py = depthY(CONFIG.zPlayer);
    burst(px, py, 16, ['rgba(200,215,240,0.85)', 'rgba(160,185,220,0.7)'],
      { spd: 4.2, life: 20, size: 6, grav: 0.08, up: 0.5, layer: 'back' });
  }
  fx.prevJumpT = g.jumpT;

  // Game over: big crash burst + heavy shake + flash.
  if (g.over && !fx.prevOver) {
    const px = laneCenterX(playerLaneFloat(g), CONFIG.zPlayer);
    const py = depthY(CONFIG.zPlayer) - 50;
    const cols = g.deathBy === KINDS.BARRIER
      ? ['#5d8df8', '#9ec1ff', '#ffffff', '#ff7b72']
      : ['#ff6b8b', '#ffd166', '#ffffff', '#ff7b72'];
    burst(px, py, 46, cols, { spd: 7, life: 46, size: 7, up: 3, grav: 0.22, shape: 'spark' });
    burst(px, py, 24, ['#ffffff'], { spd: 9, life: 18, size: 4, grav: 0 });
    fx.shake = 18; fx.flash = 0.85;
  }
  fx.prevOver = g.over;
}

function draw(g) {
  // Screen shake offset.
  const sx = fx.shake ? (Math.random() - 0.5) * fx.shake : 0;
  const sy = fx.shake ? (Math.random() - 0.5) * fx.shake : 0;
  ctx.save();
  ctx.translate(sx, sy);

  drawBackground(g);
  drawTrack(g);

  // Back-layer particles (dust) under everything.
  drawParticles('back');

  // Draw entities far-to-near (painter's algorithm) and record screen pos.
  fx.screenPos.clear();
  const sorted = [...g.entities].sort((a, b) => b.z - a.z);
  for (const e of sorted) drawEntity(g, e);

  // Player.
  drawPlayer(g);

  // Front-layer particles (sparkles, bursts) over the action.
  drawParticles('front');
  drawPops();

  ctx.restore();

  // Full-screen white flash (not shaken).
  if (fx.flash > 0.01) {
    ctx.save();
    ctx.globalAlpha = fx.flash * 0.6;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, CONFIG.canvasW, CONFIG.canvasH);
    ctx.restore();
  }

  // Overlays.
  if (g.over) drawGameOver(g);
  else if (g.paused) drawCenterText('PAUSED', '#ffd166');
}

// ---- Background: parallax arcade sunset + rushing neon scenery -----------
function drawBackground(g) {
  const W = CONFIG.canvasW, H = CONFIG.canvasH, hor = depthY(1);
  // Sky gradient.
  const sky = ctx.createLinearGradient(0, 0, 0, hor + 40);
  sky.addColorStop(0, '#2a1a52');
  sky.addColorStop(0.45, '#5a2a82');
  sky.addColorStop(0.75, '#c2407e');
  sky.addColorStop(1, '#ff8c5a');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, hor + 40);

  // Sun glow.
  const camX = (playerLaneFloat(g) - (CONFIG.lanes - 1) / 2) * 18;
  const sunX = W / 2 - camX * 0.3, sunY = hor - 18;
  const sg = ctx.createRadialGradient(sunX, sunY, 4, sunX, sunY, 130);
  sg.addColorStop(0, 'rgba(255,240,180,0.95)');
  sg.addColorStop(0.4, 'rgba(255,170,90,0.55)');
  sg.addColorStop(1, 'rgba(255,120,90,0)');
  ctx.fillStyle = sg;
  ctx.fillRect(0, 0, W, hor + 60);
  ctx.fillStyle = '#ffe9b0';
  ctx.beginPath(); ctx.arc(sunX, sunY, 34, 0, Math.PI * 2); ctx.fill();
  // Sun bands.
  ctx.fillStyle = '#ff8c5a';
  for (let i = 0; i < 4; i++) {
    ctx.fillRect(sunX - 36, sunY + 8 + i * 8, 72, 3.5);
  }

  // Distant skyline silhouette (slow parallax by camera x).
  ctx.fillStyle = 'rgba(40,20,60,0.85)';
  const baseY = hor + 6;
  for (let i = -2; i < 16; i++) {
    const seed = (i * 928371) % 97;
    const bw = 26 + (seed % 5) * 9;
    const bh = 24 + (seed % 7) * 12;
    const bx = ((i * 64 - camX * 0.5) % (W + 128) + W + 128) % (W + 128) - 64;
    ctx.fillRect(bx, baseY - bh, bw, bh);
    ctx.fillStyle = 'rgba(255,210,150,0.10)';
    for (let wy = baseY - bh + 5; wy < baseY - 3; wy += 8)
      ctx.fillRect(bx + 4, wy, bw - 8, 2);
    ctx.fillStyle = 'rgba(40,20,60,0.85)';
  }

  // Ground beyond the track.
  const grd = ctx.createLinearGradient(0, hor, 0, H);
  grd.addColorStop(0, '#241640');
  grd.addColorStop(1, '#150d28');
  ctx.fillStyle = grd;
  ctx.fillRect(0, hor + 4, W, H - hor);

  // Rushing side scenery (pylons) — strong sense of speed.
  drawSideScenery(g);

  // Speed motion lines from the vanishing point (scale with speed).
  const speedLines = Math.min(18, 4 + Math.round((g.speedMult - 1) * 22));
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.10)';
  ctx.lineWidth = 2;
  const vpx = W / 2 - camX * 0.5, vpy = hor;
  for (let i = 0; i < speedLines; i++) {
    const ang = (i / speedLines) * Math.PI * 2 + fx.bgScroll * 0.02;
    const z0 = ((i * 0.137 + fx.bgScroll * 0.012) % 1);
    const r0 = 60 + z0 * 240, r1 = r0 + 30 + z0 * 90;
    ctx.globalAlpha = 0.04 + z0 * 0.10;
    ctx.beginPath();
    ctx.moveTo(vpx + Math.cos(ang) * r0, vpy + Math.sin(ang) * r0 * 0.7);
    ctx.lineTo(vpx + Math.cos(ang) * r1, vpy + Math.sin(ang) * r1 * 0.7);
    ctx.stroke();
  }
  ctx.restore();
}

// Neon pylons flanking the track that rush past as you run.
function drawSideScenery(g) {
  const N = 9;
  const phase = (fx.bgScroll * 0.012) % 1;
  const neon = ['#ff3d81', '#3df0ff', '#b14dff', '#ffd23d'];
  for (let i = 0; i < N; i++) {
    let z = ((i / N) + phase) % 1;
    z = 1 - z; // near..far
    if (z >= 0.985) continue;
    const s = depthScale(z);
    const col = neon[i % neon.length];
    for (const side of [-1, 1]) {
      const x = laneCenterX(side > 0 ? CONFIG.lanes - 0.5 : -0.5, z) + side * 30 * s;
      const y = depthY(z);
      const h = 70 * s, w = 9 * s;
      ctx.save();
      ctx.globalAlpha = Math.min(1, z * 1.3) * 0.9;
      ctx.shadowColor = col; ctx.shadowBlur = 16 * s;
      ctx.fillStyle = col;
      ctx.fillRect(x - w / 2, y - h, w, h);
      // glowing cap
      ctx.beginPath(); ctx.arc(x, y - h, 5 * s, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }
}

function drawTrack(g) {
  ctx.save();
  // Track polygon with a subtle gradient.
  const topL = laneCenterX(-0.5, 1), topR = laneCenterX(CONFIG.lanes - 0.5, 1);
  const botL = laneCenterX(-0.5, 0), botR = laneCenterX(CONFIG.lanes - 0.5, 0);
  const tg = ctx.createLinearGradient(0, depthY(1), 0, depthY(0));
  tg.addColorStop(0, '#2b2150');
  tg.addColorStop(1, '#191236');
  ctx.beginPath();
  ctx.moveTo(topL, depthY(1));
  ctx.lineTo(topR, depthY(1));
  ctx.lineTo(botR, depthY(0));
  ctx.lineTo(botL, depthY(0));
  ctx.closePath();
  ctx.fillStyle = tg;
  ctx.fill();

  // Glowing track edge rails.
  for (const edge of [-0.5, CONFIG.lanes - 0.5]) {
    ctx.beginPath();
    ctx.moveTo(laneCenterX(edge, 1), depthY(1));
    ctx.lineTo(laneCenterX(edge, 0), depthY(0));
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#36e0ff';
    ctx.shadowColor = '#36e0ff'; ctx.shadowBlur = 12;
    ctx.stroke();
  }
  ctx.shadowBlur = 0;

  // Lane divider dashed lines.
  ctx.strokeStyle = 'rgba(170,190,230,0.30)';
  ctx.lineWidth = 2;
  for (let l = 1; l < CONFIG.lanes; l++) {
    const lf = l - 0.5;
    ctx.beginPath();
    ctx.moveTo(laneCenterX(lf, 1), depthY(1));
    ctx.lineTo(laneCenterX(lf, 0), depthY(0));
    ctx.stroke();
  }

  // Moving rungs (chevrons) for a strong sense of speed.
  const phase = (fx.bgScroll * 0.014) % 1;
  for (let i = 0; i < 14; i++) {
    let z = ((i / 14) + phase) % 1;
    z = 1 - z;
    const a = Math.min(0.5, (1 - z) * 0.6);
    ctx.strokeStyle = `rgba(120,200,255,${0.08 + a * 0.18})`;
    ctx.lineWidth = 1 + (1 - z) * 2.5;
    ctx.beginPath();
    ctx.moveTo(laneCenterX(-0.5, z), depthY(z));
    ctx.lineTo(laneCenterX((CONFIG.lanes - 1) / 2, z + 0.012), depthY(z) - 6 * (1 - z));
    ctx.lineTo(laneCenterX(CONFIG.lanes - 0.5, z), depthY(z));
    ctx.stroke();
  }
  ctx.restore();
}

function drawEntity(g, e) {
  const x = laneCenterX(e.lane, e.z);
  const y = depthY(e.z);
  const s = depthScale(e.z);
  fx.screenPos.set(e.id, { x, y, kind: e.kind });
  if (e.collected || e.resolved) return;

  if (e.kind === KINDS.COIN) {
    drawCoin(x, y - 30 * s, s, e.id);
  } else if (e.kind === KINDS.GROUND) {
    drawHurdle(x, y, s);
  } else if (e.kind === KINDS.BARRIER) {
    drawBarrier(x, y, s);
  }
}

// Spinning 3D-look gold coin with shine + sparkle. "JUMP/SWITCH" read N/A.
function drawCoin(cx, cy, s, id) {
  const t = fx.runPhase * 2.6 + (id || 0) * 1.3;
  const ww = Math.abs(Math.cos(t));          // perspective squash -> 3D spin
  const rw = 15 * s * (0.18 + 0.82 * ww);
  const rh = 15 * s;
  ctx.save();
  ctx.shadowColor = 'rgba(255,200,60,0.8)'; ctx.shadowBlur = 14 * s;
  // edge / rim
  ctx.fillStyle = '#b8860b';
  ctx.beginPath(); ctx.ellipse(cx, cy, rw + 2 * s, rh + 2 * s, 0, 0, Math.PI * 2); ctx.fill();
  // face
  const cg = ctx.createLinearGradient(cx - rw, cy - rh, cx + rw, cy + rh);
  cg.addColorStop(0, '#fff1a8');
  cg.addColorStop(0.5, '#ffcf3a');
  cg.addColorStop(1, '#d99a16');
  ctx.fillStyle = cg;
  ctx.beginPath(); ctx.ellipse(cx, cy, rw, rh, 0, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  // star emboss
  if (ww > 0.3) {
    ctx.fillStyle = 'rgba(180,120,10,0.55)';
    ctx.font = `bold ${16 * s * ww}px Segoe UI, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('★', cx, cy + 1 * s);
  }
  // moving shine streak
  ctx.globalAlpha = 0.8;
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath();
  ctx.ellipse(cx - rw * 0.35, cy - rh * 0.4, rw * 0.18, rh * 0.55, -0.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  // periodic sparkle
  if (((t * 0.5) % 6.283) < 0.25) {
    addParticle({ x: cx + rw, y: cy - rh, vx: 0, vy: 0, life: 10, size: 3 * s,
      color: '#ffffff', grav: 0, shape: 'spark' });
  }
}

// GROUND hurdle: short, striped, with a "JUMP" cue — chunky with shading.
function drawHurdle(x, y, s) {
  const w = 74 * s, h = 30 * s;
  const top = y - h;
  ctx.save();
  // soft contact shadow
  ctx.fillStyle = 'rgba(0,0,0,0.30)';
  ctx.beginPath(); ctx.ellipse(x, y + 2, w * 0.55, 7 * s, 0, 0, Math.PI * 2); ctx.fill();
  // legs
  ctx.fillStyle = '#7a2230';
  ctx.fillRect(x - w / 2, top, 8 * s, h + 6 * s);
  ctx.fillRect(x + w / 2 - 8 * s, top, 8 * s, h + 6 * s);
  // bar with hazard stripes
  const bg = ctx.createLinearGradient(0, top, 0, top + h);
  bg.addColorStop(0, '#ff8a5b'); bg.addColorStop(1, '#e23d5a');
  ctx.fillStyle = bg;
  roundRect(x - w / 2, top, w, h, 6 * s); ctx.fill();
  ctx.save();
  roundRect(x - w / 2, top, w, h, 6 * s); ctx.clip();
  ctx.strokeStyle = 'rgba(20,10,20,0.55)'; ctx.lineWidth = 7 * s;
  for (let i = -2; i < 10; i++) {
    ctx.beginPath();
    ctx.moveTo(x - w / 2 + i * 14 * s, top - 4);
    ctx.lineTo(x - w / 2 + i * 14 * s - 18 * s, top + h + 4);
    ctx.stroke();
  }
  ctx.restore();
  // top highlight
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.fillRect(x - w / 2 + 3 * s, top + 2 * s, w - 6 * s, 3 * s);
  // up-arrow "JUMP" cue floating above
  const bob = Math.sin(fx.runPhase * 3) * 3 * s;
  ctx.fillStyle = 'rgba(255,240,150,0.95)';
  ctx.font = `bold ${13 * s}px Segoe UI, sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText('▲ JUMP', x, top - 8 * s + bob);
  ctx.restore();
}

// BARRIER: tall solid neon slab — clearly "can't jump, switch lane".
function drawBarrier(x, y, s) {
  const w = 80 * s, h = 96 * s;
  const top = y - h;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.32)';
  ctx.beginPath(); ctx.ellipse(x, y + 2, w * 0.55, 8 * s, 0, 0, Math.PI * 2); ctx.fill();
  // body with neon gradient + glow
  ctx.shadowColor = '#5d8df8'; ctx.shadowBlur = 18 * s;
  const bg = ctx.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
  bg.addColorStop(0, '#3457c9'); bg.addColorStop(0.5, '#6f9bff'); bg.addColorStop(1, '#2a3f9e');
  ctx.fillStyle = bg;
  roundRect(x - w / 2, top, w, h, 8 * s); ctx.fill();
  ctx.shadowBlur = 0;
  // neon frame
  ctx.lineWidth = 3 * s; ctx.strokeStyle = '#bcd4ff';
  roundRect(x - w / 2 + 3 * s, top + 3 * s, w - 6 * s, h - 6 * s, 6 * s); ctx.stroke();
  // hazard chevrons
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  for (let i = 0; i < 4; i++) {
    const yy = top + 10 * s + i * (h - 16 * s) / 4;
    ctx.beginPath();
    ctx.moveTo(x - w / 2 + 8 * s, yy);
    ctx.lineTo(x, yy + 10 * s);
    ctx.lineTo(x + w / 2 - 8 * s, yy);
    ctx.lineTo(x + w / 2 - 8 * s, yy + 5 * s);
    ctx.lineTo(x, yy + 15 * s);
    ctx.lineTo(x - w / 2 + 8 * s, yy + 5 * s);
    ctx.closePath(); ctx.fill();
  }
  // no-jump cue
  const bob = Math.sin(fx.runPhase * 3 + 1) * 3 * s;
  ctx.fillStyle = 'rgba(190,220,255,0.95)';
  ctx.font = `bold ${12 * s}px Segoe UI, sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText('◀ ▶ DODGE', x, top - 8 * s + bob);
  ctx.restore();
}

// ---- The mascot: a lively running fox -----------------------------------
function drawPlayer(g) {
  const lf = playerLaneFloat(g);
  const z = CONFIG.zPlayer;
  const x = laneCenterX(lf, z);
  const baseY = depthY(z);
  const s = depthScale(z) * 0.92;
  const liftN = jumpLift(g);
  const lift = liftN * 135;
  const air = g.jumpT > 0;

  // Shadow shrinks + fades as the runner rises.
  ctx.save();
  ctx.globalAlpha = 0.38 * (1 - liftN * 0.7);
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(x, baseY + 2, (34 - liftN * 16) * s, (11 - liftN * 5) * s, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Squash & stretch.
  let sx = 1, sy = 1;
  if (air) {
    const vel = Math.cos(Math.PI * (1 - g.jumpT / CONFIG.jumpTicks)); // +rising / -falling
    sy = 1 + vel * 0.16; sx = 1 - vel * 0.12;
  }
  if (fx.land > 0) { sy *= 1 - 0.34 * fx.land; sx *= 1 + 0.30 * fx.land; }

  // Running bob (vertical) + lean.
  const run = fx.runPhase;
  const bob = air ? 0 : Math.abs(Math.sin(run)) * 4 * s;
  const lean = air ? 0.04 : Math.sin(run) * 0.03;

  ctx.save();
  ctx.translate(x, baseY - lift - bob);
  ctx.rotate(lean);
  ctx.scale(sx, sy);
  ctx.scale(s, s); // now draw in local units (~ -1 px scale), feet at y=0

  drawFox(g, run, air);
  ctx.restore();
}

// Draws the fox in local space: feet at y=0, body extends upward (-y).
function drawFox(g, run, air) {
  const ORANGE = '#ff9b3d', ORANGE_D = '#ef7d22', CREAM = '#ffe9c7', DARK = '#3a2417';
  const hipY = -26, shoulderY = -50, headY = -70;

  // Tail (behind body) — wags with run cycle.
  const tw = Math.sin(run * 1.2) * 0.5;
  ctx.save();
  ctx.translate(-14, hipY - 4);
  ctx.rotate(0.5 + tw);
  ctx.fillStyle = ORANGE;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(-26, -2, -34, 16);
  ctx.quadraticCurveTo(-22, 8, 0, 10);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = CREAM; // tail tip
  ctx.beginPath(); ctx.ellipse(-32, 14, 7, 8, 0.4, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // Legs — swing opposite phases (tuck when airborne).
  const legSwing = air ? -0.5 : Math.sin(run) * 0.85;
  drawLimb(-7, hipY, (air ? 0.6 : 0) + legSwing, 22, 8, ORANGE_D, DARK);   // back leg
  drawLimb(7, hipY, (air ? 0.6 : 0) - legSwing, 22, 8, ORANGE, DARK);      // front leg

  // Back arm (behind body).
  const armSwing = air ? 0.9 : Math.sin(run + Math.PI) * 0.9;
  drawLimb(-9, shoulderY + 4, (air ? -1.7 : 0) - armSwing, 18, 7, ORANGE_D, CREAM);

  // Body (egg-shaped) with belly.
  ctx.fillStyle = ORANGE;
  ctx.beginPath();
  ctx.ellipse(0, (hipY + shoulderY) / 2, 16, 18, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = CREAM; // belly
  ctx.beginPath();
  ctx.ellipse(3, (hipY + shoulderY) / 2 + 2, 9, 13, 0.1, 0, Math.PI * 2);
  ctx.fill();

  // Front arm (over body).
  drawLimb(8, shoulderY + 4, (air ? -1.9 : 0) + armSwing, 18, 7, ORANGE, CREAM);

  // Head.
  ctx.save();
  ctx.translate(2, headY);
  ctx.rotate(air ? -0.12 : Math.sin(run) * 0.05);
  // ears
  ctx.fillStyle = ORANGE;
  for (const ex of [-9, 9]) {
    ctx.beginPath();
    ctx.moveTo(ex, -6); ctx.lineTo(ex + (ex < 0 ? -3 : 3), -20); ctx.lineTo(ex + (ex < 0 ? 7 : -7), -7);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = DARK; // ear tips
  for (const ex of [-9, 9]) {
    ctx.beginPath();
    ctx.moveTo(ex + (ex < 0 ? -3 : 3), -20); ctx.lineTo(ex + (ex < 0 ? 1 : -1), -13); ctx.lineTo(ex + (ex < 0 ? 3 : -3), -14);
    ctx.closePath(); ctx.fill();
  }
  // face
  ctx.fillStyle = ORANGE;
  ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.fill();
  // cheeks/muzzle cream
  ctx.fillStyle = CREAM;
  ctx.beginPath(); ctx.ellipse(0, 4, 10, 8, 0, 0, Math.PI * 2); ctx.fill();
  // snout
  ctx.fillStyle = ORANGE;
  ctx.beginPath(); ctx.moveTo(-5, 2); ctx.lineTo(5, 2); ctx.lineTo(0, 12); ctx.closePath(); ctx.fill();
  ctx.fillStyle = DARK; // nose
  ctx.beginPath(); ctx.arc(0, 9, 2.6, 0, Math.PI * 2); ctx.fill();
  // eyes (big, forward) + blink-free shine
  const eyeY = -2;
  for (const ex of [-6, 6]) {
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(ex, eyeY, 3.4, 4.2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = DARK;
    ctx.beginPath(); ctx.arc(ex + 1, eyeY + 0.5, 2.1, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(ex + 1.8, eyeY - 0.8, 0.8, 0, Math.PI * 2); ctx.fill();
  }
  // blush
  ctx.fillStyle = 'rgba(255,120,120,0.35)';
  ctx.beginPath(); ctx.arc(-9, 4, 2.6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(9, 4, 2.6, 0, Math.PI * 2); ctx.fill();
  // determined eyebrows
  ctx.strokeStyle = DARK; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(-9, eyeY - 6); ctx.lineTo(-3, eyeY - 5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(9, eyeY - 6); ctx.lineTo(3, eyeY - 5); ctx.stroke();
  ctx.restore();

  // Airborne sparkle aura.
  if (air) {
    ctx.strokeStyle = 'rgba(255,230,140,0.5)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, shoulderY + 6, 30, 0, Math.PI * 2); ctx.stroke();
  }
}

// A rounded-capsule limb rotated about its top joint; draws a foot/paw cap.
function drawLimb(ox, oy, angle, len, w, color, footColor) {
  ctx.save();
  ctx.translate(ox, oy);
  ctx.rotate(angle);
  ctx.fillStyle = color;
  roundRect(-w / 2, 0, w, len, w / 2); ctx.fill();
  ctx.fillStyle = footColor;
  ctx.beginPath(); ctx.ellipse(0, len, w * 0.7, w * 0.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// ---- Particles & pops ----------------------------------------------------
function drawParticles(layer) {
  for (const p of fx.particles) {
    if ((p.layer || 'front') !== layer) continue;
    const a = p.fade === false ? 1 : Math.max(0, p.life / p.max);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    if (p.shape === 'spark') {
      ctx.fillRect(-p.size / 2, -p.size / 6, p.size, p.size / 3);
      ctx.fillRect(-p.size / 6, -p.size / 2, p.size / 3, p.size);
    } else {
      ctx.beginPath(); ctx.arc(0, 0, p.size, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
}

function drawPops() {
  for (const p of fx.pops) {
    const a = 1 - p.t / p.max;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.font = 'bold 18px Segoe UI, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(p.text, p.x, p.y - p.t * 0.9);
    ctx.restore();
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawCenterText(text, color) {
  ctx.save();
  ctx.fillStyle = 'rgba(8,10,14,0.55)';
  ctx.fillRect(0, CONFIG.canvasH / 2 - 70, CONFIG.canvasW, 140);
  ctx.fillStyle = color || '#fff';
  ctx.font = 'bold 44px Segoe UI, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = color || '#fff'; ctx.shadowBlur = 20;
  ctx.fillText(text, CONFIG.canvasW / 2, CONFIG.canvasH / 2);
  ctx.restore();
}

function drawGameOver(g) {
  const cx = CONFIG.canvasW / 2, cy = CONFIG.canvasH / 2;
  const t = Math.min(1, fx.overT / 18);
  ctx.save();
  ctx.fillStyle = `rgba(10,6,22,${0.74 * t})`;
  ctx.fillRect(0, 0, CONFIG.canvasW, CONFIG.canvasH);
  // Pop-in scale for the title.
  const sc = 0.6 + 0.4 * easeInOut(t) + Math.sin(fx.overT * 0.12) * 0.02;
  ctx.translate(cx, cy - 60);
  ctx.scale(sc, sc);
  ctx.textAlign = 'center';
  ctx.shadowColor = '#ff4d6d'; ctx.shadowBlur = 24;
  ctx.fillStyle = '#ff6b8b';
  ctx.font = 'bold 56px Segoe UI, sans-serif';
  ctx.fillText('GAME OVER', 0, 0);
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = t;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd166';
  ctx.font = 'bold 22px Segoe UI, sans-serif';
  const what = g.deathBy === KINDS.BARRIER ? 'Crashed into a barrier'
             : g.deathBy === KINDS.GROUND ? 'Tripped on a hurdle' : 'Wiped out';
  ctx.fillText(what, cx, cy - 6);
  ctx.fillStyle = '#e6edf3';
  ctx.font = '20px Segoe UI, sans-serif';
  ctx.fillText(`Score ${g.score}   ·   ⛁ ${g.coins}   ·   ${Math.round(g.distance)}m`, cx, cy + 28);
  ctx.fillStyle = '#9aa6c2';
  ctx.font = '16px Segoe UI, sans-serif';
  const pulse = 0.6 + 0.4 * Math.abs(Math.sin(fx.overT * 0.08));
  ctx.globalAlpha = t * pulse;
  ctx.fillText('Press  R  to run again', cx, cy + 70);
  ctx.restore();
}

// ---- HUD -----------------------------------------------------------------
function updateHud(g) {
  document.getElementById('score').textContent = g.score;
  document.getElementById('coins').textContent = g.coins;
  document.getElementById('dist').textContent = Math.round(g.distance);
  document.getElementById('speed').textContent = g.speedMult.toFixed(1);
  document.getElementById('state').textContent = g.lastState || '—';
}

// ---- Input ---------------------------------------------------------------
let pendingAction = 'stay';
window.addEventListener('keydown', (ev) => {
  switch (ev.key) {
    case 'ArrowLeft':  pendingAction = 'left';  ev.preventDefault(); break;
    case 'ArrowRight': pendingAction = 'right'; ev.preventDefault(); break;
    case 'ArrowUp':
    case ' ':          pendingAction = 'jump';  ev.preventDefault(); break;
    case 'r': case 'R':
      game = newGame(); break;
    case 'p': case 'P':
      if (!game.over) game.paused = !game.paused; break;
  }
});

// ---- Main loop -----------------------------------------------------------
let acc = 0, last = performance.now();
function loop(now) {
  let dt = now - last; last = now;
  if (dt > 100) dt = 100; // clamp after tab-out so physics/particles don't jump
  acc += dt;
  // Fixed-timestep logic (unchanged).
  while (acc >= CONFIG.tickMs) {
    const action = agentStep(game);
    step(game, action);
    acc -= CONFIG.tickMs;
  }
  // Presentation-only: reset FX on a fresh run, then react to state changes.
  if (game !== fx.gameRef) { resetFx(); fx.gameRef = game; }
  const dtf = dt / CONFIG.tickMs; // frames elapsed
  detectEvents(game);
  updateFx(game, dtf);
  draw(game);
  updateHud(game);
  requestAnimationFrame(loop);
}

game = newGame();
game.lastState = encodeState(game);
requestAnimationFrame(loop);
</script>
