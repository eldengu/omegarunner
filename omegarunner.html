<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>omegarunner</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #bfe6ff;
    background: linear-gradient(#a9e0ff 0%, #d8f1ff 60%, #eef9ff 100%);
    color: #1a3a5c;
    font-family: "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 16px;
  }
  h1 {
    margin: 4px 0 0;
    font-size: 22px;
    letter-spacing: 4px;
    font-weight: 800;
    color: #1769b0;
    text-shadow: 2px 2px 0 #ffffff;
  }
  #game {
    background: #a9e0ff;
    border: 4px solid #10233f;
    border-radius: 6px;
    box-shadow: 0 8px 24px rgba(30,80,130,0.35);
    display: block;
    image-rendering: pixelated;
  }
  .row {
    display: flex;
    gap: 24px;
    align-items: flex-start;
    width: 820px;
    max-width: 100%;
  }
  .col { flex: 1; }
  .panel {
    background: #ffffff;
    border: 2px solid #7fc0ea;
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 12px;
    line-height: 1.5;
    color: #1a3a5c;
  }
  .panel h2 {
    margin: 0 0 6px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #2e7fb8;
  }
  #state {
    white-space: pre-wrap;
    font-family: "Cascadia Code", "Consolas", monospace;
    font-size: 12px;
    color: #1769b0;
    margin: 0;
  }
  .hint { color: #4a7aa0; font-size: 12px; }
  kbd {
    background: #eaf6ff;
    border: 1px solid #7fc0ea;
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 6px;
    font-family: monospace;
    font-size: 11px;
    color: #10233f;
  }
</style>
</head>
<body>
<div id="wrap">
  <h1>OMEGARUNNER</h1>
  <canvas id="game" width="600" height="640"></canvas>
  <div class="row">
    <div class="col">
      <div class="panel" id="hud">
        <h2>Controls</h2>
        <div class="hint">
          <kbd>&larr;</kbd> <kbd>&rarr;</kbd> waddle between lanes &nbsp;
          <kbd>&uarr;</kbd> / <kbd>Space</kbd> hop &nbsp;
          <kbd>R</kbd> restart &nbsp;
          <kbd>P</kbd> pause
          <div style="margin-top:6px">
            Hop the <b style="color:#1f7a3a">ice holes</b>; switch lanes to dodge the
            <b style="color:#2e7fb8">ice blocks</b>; grab the <b style="color:#e0a700">gold flags</b>.
          </div>
        </div>
      </div>
    </div>
    <div class="col">
      <div class="panel">
        <h2>LLM State (per tick)</h2>
        <pre id="state">—</pre>
      </div>
    </div>
  </div>
</div>
<script>
"use strict";
/* =========================================================================
   omegarunner — endless runner game engine
   Single-file canvas game. No LLM yet; agentStep() is the seam where an
   LLM (or any policy) will later choose an action each tick.
   ========================================================================= */

// ---- Configuration -------------------------------------------------------
const CONFIG = {
  lanes: 3,
  canvasW: 600,
  canvasH: 640,
  horizonY: 120,        // where the track converges (top)
  laneSwitchTicks: 6,   // ticks to slide between lanes (visual smoothing)
  jumpTicks: 26,        // total airtime of a jump, in ticks
  jumpHeight: 1.0,      // peak lift as fraction (used by arc)
  tickMs: 1000 / 60,    // logic runs per animation frame (~60 fps)
  baseSpeed: 0.18,      // world units (track-fraction) per tick at 1x
  speedRampPer1000: 0.30, // speed multiplier gained per 1000 distance units
  speedMax: 2.1,        // cap so late game stays humanly reactable
  spawnGapMin: 22,      // min ticks between spawn attempts
  spawnGapMax: 40,      // max ticks between spawn attempts
  hardRowExtraGap: 12,  // extra spacing after a hard (blocking) row
  coinValue: 10,
  // An entity's "z" is its position along the track: 1.0 = far horizon,
  // 0.0 = at the player's feet. It decreases each tick as it approaches.
  zStart: 1.0,
  zPlayer: 0.08,        // z at which an entity is level with the player
  zDespawn: -0.05,
};

// Obstacle kinds:
//  'ground'  -> can be avoided by switching lane OR jumping over it.
//  'barrier' -> tall; can ONLY be avoided by switching lane (no jumping).
const KINDS = { GROUND: 'ground', BARRIER: 'barrier', COIN: 'coin' };

// ---- Game state ----------------------------------------------------------
let game;

function newGame() {
  return {
    tick: 0,
    running: true,
    paused: false,
    over: false,
    score: 0,
    coins: 0,
    distance: 0,
    speedMult: 1.0,
    // player
    lane: 1,                 // logical lane index (0..lanes-1)
    laneFrom: 1,             // for visual interpolation
    laneAnim: 0,             // ticks remaining in lane slide
    jumpT: 0,                // ticks remaining in current jump (0 = grounded)
    // world
    entities: [],            // {id, kind, lane, z}
    nextId: 1,
    spawnCountdown: 30,
    lastRowHard: false,      // pacing: was the previous spawned row a blocking one?
    lastState: '',
  };
}

// ---- Spawning ------------------------------------------------------------
// Deterministic-ish RNG seam left simple (Math.random) for now.
function rint(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }

function trySpawn(g) {
  g.spawnCountdown--;
  if (g.spawnCountdown > 0) return;
  g.spawnCountdown = rint(CONFIG.spawnGapMin, CONFIG.spawnGapMax);

  // Difficulty pacing: a "hard" row blocks two or three lanes and demands a
  // precise response (dodge or jump). Never place two hard rows back-to-back —
  // always give an easy/coin breather between them, and space them further
  // apart in time, so any sequence stays survivable for a human.
  const allowHard = !g.lastRowHard;
  const roll = Math.random();
  let hard = false;

  if (roll < 0.42) {
    // Easy: single obstacle in one lane (+ maybe a coin elsewhere).
    const lane = rint(0, CONFIG.lanes - 1);
    const kind = Math.random() < 0.5 ? KINDS.GROUND : KINDS.BARRIER;
    g.entities.push(makeEntity(g, kind, lane));
    if (Math.random() < 0.5) {
      g.entities.push(makeEntity(g, KINDS.COIN, pickOtherLane(lane)));
    }
  } else if (roll < 0.68 && allowHard) {
    // Hard: two lanes blocked, one clear lane (force a lane choice).
    hard = true;
    const clear = rint(0, CONFIG.lanes - 1);
    for (let l = 0; l < CONFIG.lanes; l++) {
      if (l === clear) continue;
      const kind = Math.random() < 0.5 ? KINDS.GROUND : KINDS.BARRIER;
      g.entities.push(makeEntity(g, kind, l));
    }
    if (Math.random() < 0.6) g.entities.push(makeEntity(g, KINDS.COIN, clear));
  } else if (roll < 0.80 && allowHard) {
    // Hard: a full row of GROUND obstacles -> must jump (all lanes covered).
    hard = true;
    for (let l = 0; l < CONFIG.lanes; l++) {
      g.entities.push(makeEntity(g, KINDS.GROUND, l));
    }
  } else {
    // Coins only — a little line of them in one lane (a breather).
    g.entities.push(makeEntity(g, KINDS.COIN, rint(0, CONFIG.lanes - 1)));
  }

  if (hard) g.spawnCountdown += CONFIG.hardRowExtraGap;
  g.lastRowHard = hard;
}

function makeEntity(g, kind, lane) {
  return { id: g.nextId++, kind, lane, z: CONFIG.zStart };
}

function pickOtherLane(lane) {
  let l;
  do { l = rint(0, CONFIG.lanes - 1); } while (l === lane);
  return l;
}

// ---- Player actions ------------------------------------------------------
// The single point an agent/LLM (or keyboard) drives the player.
//   action ∈ {'left','right','jump','stay'}
function applyAction(g, action) {
  if (action === 'left' && g.lane > 0 && g.laneAnim === 0) {
    g.laneFrom = g.lane; g.lane -= 1; g.laneAnim = CONFIG.laneSwitchTicks;
  } else if (action === 'right' && g.lane < CONFIG.lanes - 1 && g.laneAnim === 0) {
    g.laneFrom = g.lane; g.lane += 1; g.laneAnim = CONFIG.laneSwitchTicks;
  } else if (action === 'jump' && g.jumpT === 0) {
    g.jumpT = CONFIG.jumpTicks;
  }
  // 'stay' does nothing.
}

// Player vertical lift (0 = ground, up to 1 at apex) from a jump.
function jumpLift(g) {
  if (g.jumpT === 0) return 0;
  const p = 1 - (g.jumpT / CONFIG.jumpTicks); // 0..1 through the jump
  return Math.sin(Math.PI * p) * CONFIG.jumpHeight;
}

function isAirborne(g) {
  // Considered off the ground for the middle portion of the arc, high enough
  // that ground obstacles pass underneath.
  return jumpLift(g) > 0.45;
}

// ---- Simulation step -----------------------------------------------------
function step(g, action) {
  if (!g.running || g.paused || g.over) return;

  applyAction(g, action);

  // Advance timers.
  if (g.laneAnim > 0) g.laneAnim--;
  if (g.jumpT > 0) g.jumpT--;

  // Speed scales with distance, capped so it stays humanly reactable.
  g.speedMult = Math.min(CONFIG.speedMax,
    1 + (g.distance / 1000) * CONFIG.speedRampPer1000);
  const dz = CONFIG.baseSpeed * 0.06 * g.speedMult;
  g.distance += g.speedMult * 1.0;

  // Advance entities toward the player.
  for (const e of g.entities) e.z -= dz;

  // Collisions / pickups happen as entities cross the player plane.
  for (const e of g.entities) {
    if (e.collected || e.resolved) continue;
    // Entity is "at" the player when its z is within a small band of zPlayer.
    if (e.z <= CONFIG.zPlayer + 0.02 && e.z >= CONFIG.zPlayer - 0.06) {
      if (e.lane !== g.lane) continue; // different lane: no interaction
      if (e.kind === KINDS.COIN) {
        // Coins can be grabbed on the ground or mid-jump.
        e.collected = true;
        g.coins += 1;
        g.score += CONFIG.coinValue;
      } else if (e.kind === KINDS.GROUND) {
        if (isAirborne(g)) {
          e.resolved = true; // jumped over it
        } else {
          endGame(g, e);
          return;
        }
      } else if (e.kind === KINDS.BARRIER) {
        // Tall barrier: jumping does not help.
        endGame(g, e);
        return;
      }
    }
  }

  // Cull entities that have passed.
  g.entities = g.entities.filter(e => e.z > CONFIG.zDespawn && !e.collected);

  trySpawn(g);

  // Survival scoring.
  g.score += 1;
  g.tick++;

  g.lastState = encodeState(g);
}

function endGame(g, byEntity) {
  g.over = true;
  g.running = false;
  g.deathBy = byEntity ? byEntity.kind : 'obstacle';
  g.lastState = encodeState(g);
}

// ---- Text state encoder (LLM-facing) ------------------------------------
// Produces a compact textual description of the current tick: for each lane,
// the nearest notable entity ahead and how far; plus the player's lane and
// whether they are jumping or on the ground.
function encodeState(g) {
  const lines = [];
  for (let l = 0; l < CONFIG.lanes; l++) {
    // Find nearest entity ahead in this lane (smallest z that is still ahead).
    let nearest = null;
    for (const e of g.entities) {
      if (e.lane !== l || e.collected || e.resolved) continue;
      if (e.z < CONFIG.zPlayer - 0.02) continue; // already passed
      if (!nearest || e.z < nearest.z) nearest = e;
    }
    let desc;
    if (!nearest) {
      desc = 'clear';
    } else {
      // Convert z-distance to an integer "tiles ahead" for readability.
      const ahead = Math.max(0, Math.round((nearest.z - CONFIG.zPlayer) / 0.12));
      const label = nearest.kind === KINDS.GROUND ? 'ground-obstacle'
                  : nearest.kind === KINDS.BARRIER ? 'barrier-obstacle'
                  : 'coin';
      desc = `${label} ${ahead} ahead`;
    }
    lines.push(`lane${l + 1}: ${desc}`);
  }
  const posture = g.jumpT > 0 ? (isAirborne(g) ? 'jumping(airborne)' : 'jumping(rising/landing)') : 'on-ground';
  lines.push(`player in lane${g.lane + 1}, ${posture}`);
  lines.push(`score=${g.score} coins=${g.coins} speed=${g.speedMult.toFixed(2)}x`);
  return lines.join('; ');
}

// ---- Agent seam (LLM goes here later) -----------------------------------
// For now returns the keyboard-buffered action. Later: query an LLM with
// encodeState(g) and map its reply to one of {left,right,jump,stay}.
function agentStep(g) {
  const a = pendingAction;
  pendingAction = 'stay';
  return a;
}

// ---- Rendering -----------------------------------------------------------
// NOTE: This entire section is presentation-only. It reads game state but
// never mutates it. All "juice" (particles, shake, pops) is derived by
// DIFFING game state between frames in detectEvents(), so the simulation,
// spawn logic, scoring, encodeState() and agentStep() are untouched.
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// Map a lane index + z-depth to screen coordinates with simple perspective.
function laneCenterX(laneFloat, z) {
  // z: 1 far .. 0 near. Track widens as it comes closer.
  const near = 1 - z; // 0 far .. 1 near
  const halfTop = 70;
  const halfBot = 270;
  const half = halfTop + (halfBot - halfTop) * near;
  const cx = CONFIG.canvasW / 2;
  const laneFrac = (laneFloat - (CONFIG.lanes - 1) / 2) / ((CONFIG.lanes) / 2);
  return cx + laneFrac * half;
}
function depthY(z) {
  const near = 1 - z;
  return CONFIG.horizonY + (CONFIG.canvasH - CONFIG.horizonY) * Math.pow(near, 1.5);
}
function depthScale(z) {
  const near = 1 - z;
  return 0.25 + near * 1.05;
}

// Smooth eased lane interpolation (presentation-only easing of laneAnim).
function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
function playerLaneFloat(g) {
  if (g.laneAnim === 0) return g.lane;
  const t = easeInOut(1 - g.laneAnim / CONFIG.laneSwitchTicks);
  return g.laneFrom + (g.lane - g.laneFrom) * t;
}

// ---- Visual FX state (render-only; does NOT affect game logic) -----------
const fx = {
  gameRef: null,
  runPhase: 0,        // animation clock for the run cycle
  bgScroll: 0,        // scrolls scenery for sense of speed
  particles: [],      // {x,y,vx,vy,life,max,size,color,layer,grav,spin,rot,shape,fade}
  screenPos: new Map(),// id -> {x,y,kind} from last drawn frame (for coin-pop)
  prevCoins: 0,
  prevJumpT: 0,
  prevOver: false,
  shake: 0,           // screen-shake magnitude (px), decays
  land: 0,            // landing squash timer 0..1
  flash: 0,           // white flash on big events
  overT: 0,           // game-over animation clock
  dust: 0,            // running dust emit accumulator
  pops: [],           // {x,y,t,max,text,color} floating score pops
};
function resetFx() {
  fx.runPhase = 0; fx.bgScroll = 0; fx.particles.length = 0; fx.screenPos.clear();
  fx.prevCoins = 0; fx.prevJumpT = 0; fx.prevOver = false; fx.shake = 0;
  fx.land = 0; fx.flash = 0; fx.overT = 0; fx.dust = 0; fx.pops.length = 0;
}

function addParticle(p) {
  p.rot = p.rot || 0; p.spin = p.spin || 0; p.grav = p.grav || 0;
  p.layer = p.layer || 'front'; p.shape = p.shape || 'circle'; p.max = p.life;
  if (fx.particles.length < 600) fx.particles.push(p);
}
function burst(x, y, n, colors, opts = {}) {
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + Math.random() * 0.7;
    const spd = (opts.spd || 3) * (0.4 + Math.random());
    addParticle({
      x, y,
      vx: Math.cos(a) * spd + (opts.vx || 0),
      vy: Math.sin(a) * spd - (opts.up || 0),
      life: (opts.life || 28) * (0.6 + Math.random() * 0.7),
      size: (opts.size || 5) * (0.6 + Math.random() * 0.8),
      color: colors[(Math.random() * colors.length) | 0],
      grav: opts.grav != null ? opts.grav : 0.12,
      spin: (Math.random() - 0.5) * 0.6,
      shape: opts.shape || 'circle',
      layer: opts.layer || 'front',
      fade: opts.fade !== false,
    });
  }
}

// Update all visual-only timers/particles. dtf = frames elapsed (~1 at 60fps).
function updateFx(g, dtf) {
  const spd = (g.speedMult || 1);
  if (!g.over && !g.paused) {
    fx.runPhase += dtf * (0.32 + spd * 0.12);
    fx.bgScroll += dtf * spd * 0.9;
  }
  fx.shake *= Math.pow(0.86, dtf);
  if (fx.shake < 0.15) fx.shake = 0;
  fx.land = Math.max(0, fx.land - dtf * 0.08);
  fx.flash = Math.max(0, fx.flash - dtf * 0.08);
  if (g.over) fx.overT += dtf;

  // Running dust trail while grounded.
  if (!g.over && !g.paused && g.jumpT === 0) {
    fx.dust += dtf * spd;
    if (fx.dust > 3) {
      fx.dust = 0;
      const lf = playerLaneFloat(g);
      const px = laneCenterX(lf, CONFIG.zPlayer);
      const py = depthY(CONFIG.zPlayer);
      addParticle({
        x: px + (Math.random() - 0.5) * 26, y: py - 2,
        vx: -1.4 - Math.random() * 1.6, vy: -0.6 - Math.random(),
        life: 22, size: 4 + Math.random() * 4,
        color: 'rgba(230,245,255,0.7)', grav: 0.02, layer: 'back', shape: 'circle',
      });
    }
  }

  for (const p of fx.particles) {
    p.x += p.vx * dtf; p.y += p.vy * dtf;
    p.vy += p.grav * dtf; p.vx *= Math.pow(0.98, dtf);
    p.rot += p.spin * dtf; p.life -= dtf;
  }
  fx.particles = fx.particles.filter(p => p.life > 0);
  for (const p of fx.pops) p.t += dtf;
  fx.pops = fx.pops.filter(p => p.t < p.max);
}

// Derive juice from state changes — the only place events are detected.
function detectEvents(g) {
  // Coin collected: coins counter rose and a coin id we drew last frame is gone.
  if (g.coins > fx.prevCoins) {
    const live = new Set(g.entities.map(e => e.id));
    let placed = 0;
    for (const [id, sp] of fx.screenPos) {
      if (sp.kind === KINDS.COIN && !live.has(id)) {
        burst(sp.x, sp.y - 30, 14, ['#fff3b0', '#ffd23d', '#ffe680', '#fff'],
          { spd: 3.6, life: 28, size: 4, up: 1.5, grav: 0.16, shape: 'spark' });
        burst(sp.x, sp.y - 30, 7, ['#ffffff'], { spd: 5, life: 14, size: 3, grav: 0 });
        fx.pops.push({ x: sp.x, y: sp.y - 44, t: 0, max: 34, text: '+' + CONFIG.coinValue, color: '#ffe14d' });
        fx.flash = Math.min(0.4, fx.flash + 0.14);
        placed++;
      }
    }
    if (!placed) { // fallback: pop at player
      const px = laneCenterX(playerLaneFloat(g), CONFIG.zPlayer);
      burst(px, depthY(CONFIG.zPlayer) - 60, 14, ['#ffd166', '#fff'], { spd: 4, life: 26 });
    }
  }
  fx.prevCoins = g.coins;

  // Landing: jump timer reached 0 this frame -> squash + dust + shake.
  if (fx.prevJumpT > 0 && g.jumpT === 0 && !g.over) {
    fx.land = 1; fx.shake = Math.max(fx.shake, 5);
    const px = laneCenterX(playerLaneFloat(g), CONFIG.zPlayer);
    const py = depthY(CONFIG.zPlayer);
    burst(px, py, 14, ['rgba(255,255,255,0.95)', 'rgba(214,238,255,0.85)'],
      { spd: 3.8, life: 20, size: 6, grav: 0.06, up: 0.5, layer: 'back' });
  }
  fx.prevJumpT = g.jumpT;

  // Game over: big crash burst + heavy shake + flash.
  if (g.over && !fx.prevOver) {
    const px = laneCenterX(playerLaneFloat(g), CONFIG.zPlayer);
    const py = depthY(CONFIG.zPlayer) - 50;
    const cols = g.deathBy === KINDS.BARRIER
      ? ['#a6dbff', '#eaf8ff', '#ffffff', '#6db4e6']   // shattered ice
      : ['#bfe6ff', '#1f4e7a', '#ffffff', '#9fd0f0'];  // splash from the hole
    burst(px, py, 40, cols, { spd: 6.5, life: 44, size: 7, up: 3, grav: 0.22 });
    burst(px, py, 20, ['#ffffff'], { spd: 8, life: 18, size: 4, grav: 0 });
    fx.shake = 16; fx.flash = 0.7;
  }
  fx.prevOver = g.over;
}

function draw(g) {
  // Screen shake offset.
  const sx = fx.shake ? (Math.random() - 0.5) * fx.shake : 0;
  const sy = fx.shake ? (Math.random() - 0.5) * fx.shake : 0;
  ctx.save();
  ctx.translate(sx, sy);

  drawBackground(g);
  drawTrack(g);

  // Back-layer particles (dust) under everything.
  drawParticles('back');

  // Draw entities far-to-near (painter's algorithm) and record screen pos.
  fx.screenPos.clear();
  const sorted = [...g.entities].sort((a, b) => b.z - a.z);
  for (const e of sorted) drawEntity(g, e);

  // Player.
  drawPlayer(g);

  // Front-layer particles (sparkles, bursts) over the action.
  drawParticles('front');
  drawPops();

  ctx.restore();

  // Full-screen white flash (not shaken).
  if (fx.flash > 0.01) {
    ctx.save();
    ctx.globalAlpha = fx.flash * 0.6;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, CONFIG.canvasW, CONFIG.canvasH);
    ctx.restore();
  }

  // Overlays.
  if (g.over) drawGameOver(g);
  else if (g.paused) drawCenterText('PAUSED', '#9fe0ff');

  // Retro HUD bar always on top.
  drawHUD(g);
}

// ---- Background: bright Antarctic snowfield (flat retro colors) ----------
const SNOW_GROUND = '#f4fbff', SNOW_TRACK = '#ffffff', ICE_BLUE = '#bfe6ff';
const SKY = '#a9e0ff', HORIZON = '#7fc0ea';

function drawBackground(g) {
  const W = CONFIG.canvasW, H = CONFIG.canvasH, hor = depthY(1);

  // Flat light-blue sky.
  ctx.fillStyle = SKY;
  ctx.fillRect(0, 0, W, hor + 2);

  // A pale sun disc, simple and flat.
  const camX = (playerLaneFloat(g) - (CONFIG.lanes - 1) / 2) * 14;
  ctx.fillStyle = '#fff7d6';
  ctx.beginPath(); ctx.arc(W - 84 - camX * 0.2, 46, 22, 0, Math.PI * 2); ctx.fill();

  // Simple chunky clouds drifting slowly.
  drawClouds(camX);

  // Distant snowy hills along the horizon.
  ctx.fillStyle = '#ffffff';
  for (let i = -1; i < 8; i++) {
    const hx = ((i * 110 - camX * 0.35 - fx.bgScroll * 0.05) % (W + 220) + W + 220) % (W + 220) - 110;
    const hw = 90 + (i % 3) * 30, hh = 26 + (i % 2) * 12;
    ctx.beginPath();
    ctx.moveTo(hx - hw / 2, hor);
    ctx.quadraticCurveTo(hx, hor - hh, hx + hw / 2, hor);
    ctx.closePath(); ctx.fill();
  }
  // Soft blue shading line on the hills' base.
  ctx.fillStyle = '#e3f3ff';
  ctx.fillRect(0, hor - 2, W, 3);

  // Snowfield ground (flat) + crisp horizon line.
  ctx.fillStyle = SNOW_GROUND;
  ctx.fillRect(0, hor, W, H - hor);
  ctx.fillStyle = HORIZON;
  ctx.fillRect(0, hor, W, 2);

  // Off-track snow speckles rushing toward the camera (sense of speed).
  drawSnowSpeckles(g, true);
}

function drawClouds(camX) {
  ctx.fillStyle = '#ffffff';
  const clouds = [[120, 40, 1], [340, 26, 0.8], [520, 58, 1.1], [40, 70, 0.7]];
  for (const [bx, by, sc] of clouds) {
    const x = ((bx - fx.bgScroll * 0.12 - camX * 0.15) % 760 + 760) % 760 - 80;
    puff(x, by, 22 * sc); puff(x + 20 * sc, by - 8 * sc, 18 * sc);
    puff(x + 40 * sc, by, 22 * sc); puff(x + 20 * sc, by + 6 * sc, 20 * sc);
  }
}
function puff(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }

// Speckles of snow texture; on the off-track snow when `sides` is true.
function drawSnowSpeckles(g, sides) {
  const phase = (fx.bgScroll * 0.02) % 1;
  ctx.fillStyle = '#dcefff';
  for (let i = 0; i < 26; i++) {
    let z = ((i * 0.0739 + phase) % 1);
    z = 1 - z;
    const s = depthScale(z);
    const seed = (i * 73 % 17) / 17 - 0.5;
    // place on left or right of the track
    const side = (i % 2) ? 1 : -1;
    const edgeX = laneCenterX(side > 0 ? CONFIG.lanes - 0.5 : -0.5, z);
    const x = edgeX + side * (20 + seed * 40) * s;
    const y = depthY(z);
    ctx.fillRect(x, y, 3 * s + 1, 3 * s + 1);
  }
}

function drawTrack(g) {
  ctx.save();
  const topL = laneCenterX(-0.5, 1), topR = laneCenterX(CONFIG.lanes - 0.5, 1);
  const botL = laneCenterX(-0.5, 0), botR = laneCenterX(CONFIG.lanes - 0.5, 0);

  // Track snow (slightly brighter than the off-track field so lanes read).
  ctx.beginPath();
  ctx.moveTo(topL, depthY(1));
  ctx.lineTo(topR, depthY(1));
  ctx.lineTo(botR, depthY(0));
  ctx.lineTo(botL, depthY(0));
  ctx.closePath();
  ctx.fillStyle = SNOW_TRACK;
  ctx.fill();

  // Rushing horizontal snow bands toward the camera = forward speed.
  const phase = (fx.bgScroll * 0.016) % 1;
  for (let i = 0; i < 16; i++) {
    let z = ((i / 16) + phase) % 1;
    z = 1 - z;
    const band = (i % 2 === 0);
    ctx.fillStyle = band ? '#eaf6ff' : '#ffffff';
    const yTop = depthY(z);
    const yBot = depthY(Math.max(0, z - 0.06));
    ctx.beginPath();
    ctx.moveTo(laneCenterX(-0.5, z), yTop);
    ctx.lineTo(laneCenterX(CONFIG.lanes - 0.5, z), yTop);
    ctx.lineTo(laneCenterX(CONFIG.lanes - 0.5, z - 0.06), yBot);
    ctx.lineTo(laneCenterX(-0.5, z - 0.06), yBot);
    ctx.closePath();
    if (band) ctx.fill();
  }

  // Crisp ice-blue track edges.
  ctx.strokeStyle = '#6fb0dd';
  ctx.lineWidth = 3;
  for (const edge of [-0.5, CONFIG.lanes - 0.5]) {
    ctx.beginPath();
    ctx.moveTo(laneCenterX(edge, 1), depthY(1));
    ctx.lineTo(laneCenterX(edge, 0), depthY(0));
    ctx.stroke();
  }

  // Dashed lane dividers (light blue).
  ctx.strokeStyle = 'rgba(120,180,220,0.55)';
  ctx.lineWidth = 2;
  for (let l = 1; l < CONFIG.lanes; l++) {
    const lf = l - 0.5;
    const dphase = (fx.bgScroll * 0.016) % (1 / 8);
    for (let k = 0; k < 8; k++) {
      let z0 = (k / 8 + dphase) % 1, z1 = z0 - 0.06;
      if (z1 < 0) continue;
      z0 = 1 - z0; z1 = 1 - z1; // map near..far
      ctx.beginPath();
      ctx.moveTo(laneCenterX(lf, z0), depthY(z0));
      ctx.lineTo(laneCenterX(lf, z1), depthY(z1));
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawEntity(g, e) {
  const x = laneCenterX(e.lane, e.z);
  const y = depthY(e.z);
  const s = depthScale(e.z);
  fx.screenPos.set(e.id, { x, y, kind: e.kind });
  if (e.collected || e.resolved) return;

  if (e.kind === KINDS.COIN) {
    drawFlag(x, y, s, e.id);
  } else if (e.kind === KINDS.GROUND) {
    drawHole(x, y, s);
  } else if (e.kind === KINDS.BARRIER) {
    drawIceBlock(x, y, s);
  }
}

// COIN -> a bright gold pennant flag on a pole (waves; simple collect pop).
function drawFlag(x, y, s, id) {
  const poleH = 40 * s;
  const top = y - poleH;
  const wave = Math.sin(fx.runPhase * 3 + (id || 0)) * 3 * s;
  ctx.save();
  // contact shadow
  ctx.fillStyle = 'rgba(120,160,190,0.25)';
  ctx.beginPath(); ctx.ellipse(x, y, 10 * s, 4 * s, 0, 0, Math.PI * 2); ctx.fill();
  // pole
  ctx.fillStyle = '#9fb3c4';
  ctx.fillRect(x - 1.5 * s, top, 3 * s, poleH);
  ctx.fillStyle = '#cdd9e4';
  ctx.fillRect(x - 1.5 * s, top, 1.5 * s, poleH);
  // gold pennant (triangle) with darker fold + highlight
  ctx.fillStyle = '#ffcf2e';
  ctx.beginPath();
  ctx.moveTo(x + 1.5 * s, top + 1 * s);
  ctx.lineTo(x + 24 * s + wave, top + 8 * s);
  ctx.lineTo(x + 1.5 * s, top + 16 * s);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffe680';
  ctx.beginPath();
  ctx.moveTo(x + 1.5 * s, top + 1 * s);
  ctx.lineTo(x + 14 * s + wave * 0.5, top + 5 * s);
  ctx.lineTo(x + 1.5 * s, top + 8 * s);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e0a700';
  ctx.fillRect(x + 1.5 * s, top + 14 * s, 22 * s, 1.5 * s);
  // little gold ball on top of the pole
  ctx.fillStyle = '#ffd23d';
  ctx.beginPath(); ctx.arc(x, top, 3 * s, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// GROUND -> an ice hole / pit in the snow you must JUMP over. Flat, low.
function drawHole(x, y, s) {
  const rw = 40 * s, rh = 15 * s;
  ctx.save();
  // bright ice rim
  ctx.fillStyle = '#bfe6ff';
  ctx.beginPath(); ctx.ellipse(x, y - rh * 0.2, rw + 4 * s, rh + 3 * s, 0, 0, Math.PI * 2); ctx.fill();
  // dark water/void
  ctx.fillStyle = '#1f4e7a';
  ctx.beginPath(); ctx.ellipse(x, y - rh * 0.2, rw, rh, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#16395c';
  ctx.beginPath(); ctx.ellipse(x, y - rh * 0.2 + 2 * s, rw * 0.8, rh * 0.7, 0, 0, Math.PI * 2); ctx.fill();
  // ice cracks on the rim
  ctx.strokeStyle = '#9fd0f0'; ctx.lineWidth = 1.5 * s;
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2 + 0.4;
    ctx.beginPath();
    ctx.moveTo(x + Math.cos(a) * rw, y - rh * 0.2 + Math.sin(a) * rh);
    ctx.lineTo(x + Math.cos(a) * (rw + 6 * s), y - rh * 0.2 + Math.sin(a) * (rh + 5 * s));
    ctx.stroke();
  }
  // "JUMP" read: bobbing up-chevrons above the hole.
  const bob = Math.sin(fx.runPhase * 3) * 3 * s;
  ctx.fillStyle = '#1f7a3a';
  for (let i = 0; i < 2; i++) chevron(x, y - rh - (18 + i * 9) * s + bob, 9 * s, -1);
  ctx.restore();
}

// BARRIER -> a tall solid ice block you must DODGE (switch lane). Chunky 3D.
function drawIceBlock(x, y, s) {
  const w = 56 * s, h = 70 * s, d = 16 * s; // width, height, iso depth
  const top = y - h;
  ctx.save();
  // shadow
  ctx.fillStyle = 'rgba(120,160,190,0.30)';
  ctx.beginPath(); ctx.ellipse(x, y + 2, w * 0.65, 7 * s, 0, 0, Math.PI * 2); ctx.fill();
  // right side face (darker)
  ctx.fillStyle = '#6db4e6';
  ctx.beginPath();
  ctx.moveTo(x + w / 2, top); ctx.lineTo(x + w / 2 + d, top - d);
  ctx.lineTo(x + w / 2 + d, y - d); ctx.lineTo(x + w / 2, y);
  ctx.closePath(); ctx.fill();
  // top face (lightest)
  ctx.fillStyle = '#eaf8ff';
  ctx.beginPath();
  ctx.moveTo(x - w / 2, top); ctx.lineTo(x - w / 2 + d, top - d);
  ctx.lineTo(x + w / 2 + d, top - d); ctx.lineTo(x + w / 2, top);
  ctx.closePath(); ctx.fill();
  // front face
  ctx.fillStyle = '#a6dbff';
  ctx.fillRect(x - w / 2, top, w, h);
  // facets / shading blocks on front
  ctx.fillStyle = '#c4e8ff';
  ctx.fillRect(x - w / 2 + 5 * s, top + 6 * s, w * 0.34, h * 0.34);
  ctx.fillStyle = '#8cccf2';
  ctx.fillRect(x - w / 2 + w * 0.5, top + h * 0.45, w * 0.36, h * 0.4);
  // bright edge highlights
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2 * s;
  ctx.strokeRect(x - w / 2, top, w, h);
  // glint
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(x - w / 2 + 7 * s, top + 8 * s, 4 * s, 14 * s);
  // "DODGE" read: side chevrons.
  const bob = Math.sin(fx.runPhase * 3 + 1) * 2 * s;
  ctx.fillStyle = '#b3361f';
  chevron(x - w / 2 - 12 * s + bob, top - 8 * s, 8 * s, 2);  // left arrow
  chevron(x + w / 2 + 12 * s - bob, top - 8 * s, 8 * s, 3);  // right arrow
  ctx.restore();
}

// Small filled chevron arrow. dir: -1 up, 1 down, 2 left, 3 right.
function chevron(cx, cy, r, dir) {
  ctx.beginPath();
  if (dir === -1) { ctx.moveTo(cx - r, cy + r); ctx.lineTo(cx, cy - r); ctx.lineTo(cx + r, cy + r); ctx.lineTo(cx, cy); }
  else if (dir === 1) { ctx.moveTo(cx - r, cy - r); ctx.lineTo(cx, cy + r); ctx.lineTo(cx + r, cy - r); ctx.lineTo(cx, cy); }
  else if (dir === 2) { ctx.moveTo(cx + r, cy - r); ctx.lineTo(cx - r, cy); ctx.lineTo(cx + r, cy + r); ctx.lineTo(cx, cy); }
  else { ctx.moveTo(cx - r, cy - r); ctx.lineTo(cx + r, cy); ctx.lineTo(cx - r, cy + r); ctx.lineTo(cx, cy); }
  ctx.closePath(); ctx.fill();
}

// ---- The runner: a cute waddling penguin (front view) --------------------
function drawPlayer(g) {
  const lf = playerLaneFloat(g);
  const z = CONFIG.zPlayer;
  const x = laneCenterX(lf, z);
  const baseY = depthY(z);
  const s = depthScale(z) * 0.92;
  const liftN = jumpLift(g);
  const lift = liftN * 135;
  const air = g.jumpT > 0;

  // Round shadow, shrinks + fades as the penguin hops.
  ctx.save();
  ctx.globalAlpha = 0.30 * (1 - liftN * 0.7);
  ctx.fillStyle = '#7fb0cf';
  ctx.beginPath();
  ctx.ellipse(x, baseY + 2, (30 - liftN * 14) * s, (9 - liftN * 4) * s, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Hop squash & stretch + waddle rock.
  let sx = 1, sy = 1;
  if (air) {
    const vel = Math.cos(Math.PI * (1 - g.jumpT / CONFIG.jumpTicks));
    sy = 1 + vel * 0.14; sx = 1 - vel * 0.10;
  }
  if (fx.land > 0) { sy *= 1 - 0.30 * fx.land; sx *= 1 + 0.26 * fx.land; }
  const run = fx.runPhase;
  const bob = air ? 0 : Math.abs(Math.sin(run)) * 4 * s;
  const rock = air ? 0 : Math.sin(run) * 0.10; // side-to-side waddle

  ctx.save();
  ctx.translate(x, baseY - lift - bob);
  ctx.rotate(rock);
  ctx.scale(sx, sy);
  ctx.scale(s, s);
  drawPenguin(g, run, air);
  ctx.restore();
}

// Penguin in local space: feet at y=0, body up in -y. Flat retro colors.
function drawPenguin(g, run, air) {
  const BLACK = '#23303a', BELLY = '#ffffff', ORANGE = '#ff9f1c', ORANGE_D = '#e07d05';
  const step = air ? 0 : Math.sin(run);

  // Feet (orange) — alternate when waddling, tuck up a touch when airborne.
  const fy = air ? -8 : 0;
  ctx.fillStyle = ORANGE;
  for (const side of [-1, 1]) {
    const fx2 = side * 7 + (air ? 0 : step * side * 3);
    const fup = air ? 4 : Math.max(0, Math.sin(run + (side > 0 ? 0 : Math.PI))) * 3;
    ctx.beginPath();
    ctx.ellipse(fx2, fy - fup, 7, 4, 0, 0, Math.PI * 2); ctx.fill();
  }

  // Body: rounded black egg with a big white belly.
  const bodyCY = -28;
  ctx.fillStyle = BLACK;
  ctx.beginPath();
  ctx.ellipse(0, bodyCY, 17, 22, 0, 0, Math.PI * 2); ctx.fill();
  // white belly
  ctx.fillStyle = BELLY;
  ctx.beginPath();
  ctx.ellipse(0, bodyCY + 2, 11, 17, 0, 0, Math.PI * 2); ctx.fill();

  // Flippers (black) — swing a little; raise when airborne.
  ctx.fillStyle = BLACK;
  for (const side of [-1, 1]) {
    const sw = air ? -0.9 : Math.sin(run + (side > 0 ? Math.PI : 0)) * 0.5;
    ctx.save();
    ctx.translate(side * 16, bodyCY - 2);
    ctx.rotate(side * (0.5 + sw));
    ctx.beginPath();
    ctx.ellipse(0, 8, 5, 12, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // Head (merges with body): black dome.
  const headCY = -52;
  ctx.fillStyle = BLACK;
  ctx.beginPath(); ctx.arc(0, headCY, 15, 0, Math.PI * 2); ctx.fill();
  // white face patch
  ctx.fillStyle = BELLY;
  ctx.beginPath(); ctx.ellipse(0, headCY + 2, 10, 9, 0, 0, Math.PI * 2); ctx.fill();
  // eyes
  ctx.fillStyle = BLACK;
  ctx.beginPath(); ctx.arc(-4.5, headCY - 1, 2.3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(4.5, headCY - 1, 2.3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(-3.8, headCY - 1.8, 0.8, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(5.2, headCY - 1.8, 0.8, 0, Math.PI * 2); ctx.fill();
  // beak (orange diamond)
  ctx.fillStyle = ORANGE;
  ctx.beginPath();
  ctx.moveTo(-4, headCY + 5); ctx.lineTo(4, headCY + 5);
  ctx.lineTo(0, headCY + 11); ctx.closePath(); ctx.fill();
  ctx.fillStyle = ORANGE_D;
  ctx.fillRect(-4, headCY + 6.5, 8, 1.4);
  // rosy cheeks
  ctx.fillStyle = 'rgba(255,140,140,0.45)';
  ctx.beginPath(); ctx.arc(-7.5, headCY + 3, 2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(7.5, headCY + 3, 2, 0, Math.PI * 2); ctx.fill();

  // Tiny "wheee" sparkles when hopping.
  if (air) {
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.fillRect(-22, headCY - 6, 3, 3);
    ctx.fillRect(20, headCY + 2, 3, 3);
  }
}

// ---- Particles & pops (flat, retro) --------------------------------------
function drawParticles(layer) {
  for (const p of fx.particles) {
    if ((p.layer || 'front') !== layer) continue;
    const a = p.fade === false ? 1 : Math.max(0, p.life / p.max);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(p.x, p.y);
    // chunky pixel particles (no rotation blur) for the retro look
    ctx.fillStyle = p.color;
    const sz = Math.max(2, Math.round(p.size));
    if (p.shape === 'spark') {
      ctx.fillRect(-sz, -1, sz * 2, 2);
      ctx.fillRect(-1, -sz, 2, sz * 2);
    } else {
      ctx.fillRect(-sz / 2, -sz / 2, sz, sz);
    }
    ctx.restore();
  }
}

function drawPops() {
  for (const p of fx.pops) {
    const a = 1 - p.t / p.max;
    drawPixelText(p.text, p.x - p.text.length * 6, p.y - p.t * 0.9, 2,
      hexFade(p.color, a));
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawPixelText(text, x, y, scale, color) {
  ctx.save();
  ctx.fillStyle = color;
  let cx = x;
  for (const chRaw of String(text)) {
    const ch = chRaw.toUpperCase();
    const glyph = FONT[ch] || FONT[' '];
    for (let r = 0; r < 7; r++) {
      const row = glyph[r];
      for (let c = 0; c < 5; c++) {
        if (row[c] === '1') ctx.fillRect(cx + c * scale, y + r * scale, scale, scale);
      }
    }
    cx += 6 * scale;
  }
  ctx.restore();
  return cx - x; // width drawn
}
function pixelTextWidth(text, scale) { return String(text).length * 6 * scale; }
function hexFade(hex, a) {
  // accepts #rrggbb -> rgba with alpha
  if (hex[0] !== '#' || hex.length < 7) return hex;
  const r = parseInt(hex.slice(1, 3), 16), gg = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${gg},${b},${a})`;
}

// ---- Retro HUD bar across the top (like the original) --------------------
function drawHUD(g) {
  const W = CONFIG.canvasW, barH = 30;
  // bar background
  ctx.fillStyle = '#10233f';
  ctx.fillRect(0, 0, W, barH);
  ctx.fillStyle = '#1d3a63';
  ctx.fillRect(0, barH - 3, W, 3);
  ctx.fillStyle = '#2e5891';
  ctx.fillRect(0, 0, W, 2);

  const sec = Math.floor(g.tick / 60);
  const time = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
  const fields = [
    ['SCORE', String(g.score).padStart(5, '0'), '#ffe14d'],
    ['TIME', time, '#9fe0ff'],
    ['DIST', String(Math.round(g.distance)).padStart(4, '0') + 'M', '#9fffb0'],
    ['SPD', g.speedMult.toFixed(1) + 'X', '#ffb0d0'],
  ];
  const colW = W / fields.length;
  for (let i = 0; i < fields.length; i++) {
    const [label, val, col] = fields[i];
    const baseX = Math.round(i * colW + 8);
    drawPixelText(label, baseX, 5, 1, '#7fa8d8');
    drawPixelText(val, baseX, 14, 2, col);
  }
  // coin tally on the far right corner of the score field
  const cx = Math.round(colW - 22);
  ctx.fillStyle = '#ffcf2e';
  ctx.fillRect(cx, 6, 6, 8);
  ctx.fillStyle = '#e0a700';
  ctx.fillRect(cx, 6, 6, 2);
  drawPixelText(String(g.coins), cx + 9, 6, 1, '#ffe14d');
}

function drawCenterText(text, color) {
  const W = CONFIG.canvasW, H = CONFIG.canvasH;
  ctx.save();
  ctx.fillStyle = 'rgba(16,35,63,0.55)';
  ctx.fillRect(0, H / 2 - 36, W, 72);
  ctx.fillStyle = '#10233f';
  ctx.fillRect(0, H / 2 - 36, W, 4);
  ctx.fillRect(0, H / 2 + 32, W, 4);
  ctx.restore();
  const sc = 5;
  const w = pixelTextWidth(text, sc);
  drawPixelText(text, (W - w) / 2, H / 2 - 17, sc, color || '#ffffff');
}

function drawGameOver(g) {
  const W = CONFIG.canvasW, H = CONFIG.canvasH, cx = W / 2;
  const t = Math.min(1, fx.overT / 18);
  ctx.save();
  ctx.fillStyle = `rgba(16,35,63,${0.7 * t})`;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  // Title with a tiny retro bob.
  const sc = 5 + Math.round(Math.sin(fx.overT * 0.12) * 0.5);
  const title = 'GAME OVER';
  drawPixelText(title, (W - pixelTextWidth(title, sc)) / 2, H / 2 - 90, sc, '#ff5d6c');

  if (t > 0.5) {
    const what = g.deathBy === KINDS.BARRIER ? 'HIT AN ICE BLOCK'
               : g.deathBy === KINDS.GROUND ? 'FELL IN A HOLE' : 'WIPED OUT';
    drawPixelText(what, (W - pixelTextWidth(what, 2)) / 2, H / 2 - 30, 2, '#ffe14d');
    const line = `SCORE ${g.score}  FLAGS ${g.coins}  ${Math.round(g.distance)}M`;
    drawPixelText(line, (W - pixelTextWidth(line, 2)) / 2, H / 2 + 6, 2, '#ffffff');
    const blink = (Math.floor(fx.overT / 18) % 2) === 0;
    if (blink) {
      const pr = 'PRESS R TO RUN AGAIN';
      drawPixelText(pr, (W - pixelTextWidth(pr, 2)) / 2, H / 2 + 50, 2, '#9fe0ff');
    }
  }
}

// ---- HUD -----------------------------------------------------------------
// The score/time/dist/speed readout now lives on the canvas (drawHUD).
// Here we only mirror the LLM-facing state text into the side panel.
function updateHud(g) {
  const el = document.getElementById('state');
  if (el) el.textContent = g.lastState || '—';
}

// ---- Input ---------------------------------------------------------------
let pendingAction = 'stay';
window.addEventListener('keydown', (ev) => {
  switch (ev.key) {
    case 'ArrowLeft':  pendingAction = 'left';  ev.preventDefault(); break;
    case 'ArrowRight': pendingAction = 'right'; ev.preventDefault(); break;
    case 'ArrowUp':
    case ' ':          pendingAction = 'jump';  ev.preventDefault(); break;
    case 'r': case 'R':
      game = newGame(); break;
    case 'p': case 'P':
      if (!game.over) game.paused = !game.paused; break;
  }
});

// ---- Main loop -----------------------------------------------------------
let acc = 0, last = performance.now();
function loop(now) {
  let dt = now - last; last = now;
  if (dt > 100) dt = 100; // clamp after tab-out so physics/particles don't jump
  acc += dt;
  // Fixed-timestep logic (unchanged).
  while (acc >= CONFIG.tickMs) {
    const action = agentStep(game);
    step(game, action);
    acc -= CONFIG.tickMs;
  }
  // Presentation-only: reset FX on a fresh run, then react to state changes.
  if (game !== fx.gameRef) { resetFx(); fx.gameRef = game; }
  const dtf = dt / CONFIG.tickMs; // frames elapsed
  detectEvents(game);
  updateFx(game, dtf);
  draw(game);
  updateHud(game);
  requestAnimationFrame(loop);
}

game = newGame();
game.lastState = encodeState(game);
requestAnimationFrame(loop);
</script>
